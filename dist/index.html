<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>nuda uno</title>
<meta name="theme-color" content="#11272c">
<meta name="description" content="Pracovní prostředí finančního poradce. Klienti, případy, smlouvy, provizní výpisy, tým a vzdělávání.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%2311272c%22%2F%3E%3Ctext%20x%3D%2216%22%20y%3D%2223%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2Csans-serif%22%20font-size%3D%2226%22%20font-weight%3D%22bold%22%20fill%3D%22%2380dedb%22%3En%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{color-scheme:light dark}html,body{margin:0;min-height:100%;background:light-dark(#f4f7f7,#131c1e)}body{min-width:320px}#nuda-os-proposal{border-radius:0;min-height:100dvh}.os-shell{min-height:100dvh!important}</style>
<script src="./lucide.js"></script>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap">
<div id="nuda-os-proposal" aria-label="nuda uno — pracovní prostředí finančního poradce">
  <style>
    #nuda-os-proposal{--os-bg:light-dark(#f5f7f7,#131c1e);--os-paper:light-dark(#ffffff,#1a2629);--os-ink:light-dark(#16282c,#edf5f5);--os-muted:light-dark(#65777b,#a6b8bb);--os-line:light-dark(#e3e9e9,#334548);--os-soft:light-dark(#e9f6f4,#223f40);--os-accent:light-dark(#087d7e,#80dedb);--os-accent-ink:light-dark(#ffffff,#10282b);--os-warn:light-dark(#91601d,#f0c783);--os-warn-bg:light-dark(#fff5e6,#423521);--os-nav:#11272c;--os-nav-ink:#d0e0e2;--os-pad:22px;--os-row:15px;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1.5;color:var(--os-ink);width:100%;background:var(--os-bg);border-radius:12px;overflow:clip;border:1px solid var(--os-line)}
    #nuda-os-proposal *{box-sizing:border-box}
    #nuda-os-proposal button,#nuda-os-proposal input,#nuda-os-proposal select{font:inherit}
    #nuda-os-proposal button{cursor:pointer}
    #nuda-os-proposal button:disabled{cursor:default;opacity:.65}
    #nuda-os-proposal [hidden]{display:none!important}
    #nuda-os-proposal .os-shell{display:grid;grid-template-columns:178px minmax(0,1fr);min-height:780px}
    #nuda-os-proposal .os-sidebar{padding:24px 12px 16px;background:var(--os-nav);color:var(--os-nav-ink);display:flex;flex-direction:column;gap:25px}
    #nuda-os-proposal .os-wordmark{font-family:Poppins,sans-serif;font-size:29px;letter-spacing:-1.6px;font-weight:600;padding:0 12px;color:#f1fbfb;display:flex;gap:9px;align-items:center}
    #nuda-os-proposal .os-wordmark span{font:11px Inter,sans-serif;letter-spacing:1px;color:#83d5d5;border-left:1px solid #466266;padding-left:10px}
    #nuda-os-proposal .os-navlabel{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#90aaaf;padding:0 12px 7px}
    #nuda-os-proposal .os-nav{display:flex;flex-direction:column;gap:4px}
    #nuda-os-proposal .os-nav button{border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;text-align:left;min-height:39px}
    #nuda-os-proposal .os-nav button:hover{background:#203b40}
    #nuda-os-proposal .os-nav button[aria-current="page"]{background:#28474c;color:#abefeb}
    #nuda-os-proposal .os-count{font-size:11px;margin-left:auto;min-width:20px;text-align:center;color:#bcdddd}
    #nuda-os-proposal .os-sidebarfoot{margin-top:auto;padding-top:28px}
    #nuda-os-proposal .os-user{margin:15px 8px 0;padding-top:18px;border-top:1px solid #365056;display:flex;gap:10px;align-items:center}
    #nuda-os-proposal .os-user small{display:block;font-size:11px;color:#91aeb3}
    #nuda-os-proposal .os-avatar{display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:50%;background:var(--os-soft);color:var(--os-accent);font-size:12px;font-weight:600}
    #nuda-os-proposal .os-workspace{min-width:0;position:relative}
    #nuda-os-proposal .os-topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;min-height:65px;padding:13px var(--os-pad);background:var(--os-paper);border-bottom:1px solid var(--os-line)}
    #nuda-os-proposal .os-search{display:flex;align-items:center;gap:8px;flex:1;min-width:140px;color:var(--os-muted)}
    #nuda-os-proposal .os-search input{border:0;background:transparent;color:var(--os-ink);width:100%;min-width:0;padding:5px}
    #nuda-os-proposal .os-search input::placeholder{color:var(--os-muted)}
    #nuda-os-proposal .os-iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:34px;min-width:34px;border:1px solid var(--os-line);border-radius:7px;background:var(--os-paper);color:var(--os-ink)}
    #nuda-os-proposal .os-main{padding:var(--os-pad)}
    #nuda-os-proposal .os-pagehead{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:20px}
    #nuda-os-proposal h1{font:600 24px/1.35 Poppins,Inter,sans-serif;letter-spacing:-.7px;margin:0 0 5px;color:var(--os-ink)}
    #nuda-os-proposal h2{font-size:14px;line-height:1.4;font-weight:600;margin:0;color:var(--os-ink)}
    #nuda-os-proposal h3{font-size:13px;font-weight:600;margin:0;color:var(--os-ink)}
    #nuda-os-proposal p{margin:0}
    #nuda-os-proposal .os-sub{color:var(--os-muted);font-size:12px}
    #nuda-os-proposal .os-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--os-line);border-radius:7px;padding:8px 12px;min-height:35px;background:var(--os-paper);color:var(--os-ink);white-space:normal}
    #nuda-os-proposal .os-primary{border-color:var(--os-accent);background:var(--os-accent);color:var(--os-accent-ink)}
    #nuda-os-proposal .os-link{background:transparent;border:0;color:var(--os-accent);padding:4px 0;font-weight:500;text-align:left}
    #nuda-os-proposal .os-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
    #nuda-os-proposal .os-metric{background:var(--os-paper);border:1px solid var(--os-line);border-radius:9px;padding:14px 16px;text-align:left;color:var(--os-ink)}
    #nuda-os-proposal .os-metric strong{display:block;font-size:24px;font-weight:500;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:3px}
    #nuda-os-proposal .os-metric small{font-size:11px;color:var(--os-muted)}
    #nuda-os-proposal .os-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(210px,1fr);gap:18px;align-items:start}
    #nuda-os-proposal .os-panel{background:var(--os-paper);border:1px solid var(--os-line);border-radius:9px;min-width:0}
    #nuda-os-proposal .os-panelhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 17px;border-bottom:1px solid var(--os-line)}
    #nuda-os-proposal .os-task{display:grid;grid-template-columns:7px minmax(0,1fr) auto;align-items:center;gap:12px;margin:0 17px;padding:var(--os-row) 0;border-bottom:1px solid var(--os-line)}
    #nuda-os-proposal .os-task:last-child{border-bottom:0}
    #nuda-os-proposal .os-dot{width:6px;height:6px;border-radius:50%;background:var(--os-accent)}
    #nuda-os-proposal .os-dot.warn{background:var(--os-warn)}
    #nuda-os-proposal .os-task .os-link{font-size:12px}
    #nuda-os-proposal .os-stack{display:flex;flex-direction:column;gap:16px}
    #nuda-os-proposal .os-appointment{display:flex;gap:13px;padding:13px 16px}
    #nuda-os-proposal .os-appointment time{font-size:12px;color:var(--os-muted);font-variant-numeric:tabular-nums}
    #nuda-os-proposal .os-education{padding:16px}
    #nuda-os-proposal .os-progress{height:5px;border-radius:4px;background:var(--os-line);margin:11px 0}
    #nuda-os-proposal .os-progress span{display:block;height:100%;width:60%;background:var(--os-accent);border-radius:4px}
    #nuda-os-proposal .os-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
    #nuda-os-proposal .os-favorites{margin-top:22px}
    #nuda-os-proposal .os-favorites .os-between{margin-bottom:12px}
    #nuda-os-proposal .os-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    #nuda-os-proposal .os-tile{display:flex;align-items:center;gap:9px;padding:14px 11px;text-align:left;border:1px solid var(--os-line);border-radius:9px;color:var(--os-ink);background:var(--os-paper)}
    #nuda-os-proposal .os-tile:hover,#nuda-os-proposal .os-app:hover{border-color:var(--os-accent)}
    #nuda-os-proposal .os-tile svg{color:var(--os-accent);flex-shrink:0}
    #nuda-os-proposal .os-tablewrap{margin-top:20px;min-width:0}
    #nuda-os-proposal table{width:100%;border-collapse:collapse;font-size:12px}
    #nuda-os-proposal th{font-weight:500;text-align:left;color:var(--os-muted);background:var(--os-bg);padding:10px 16px}
    #nuda-os-proposal td{padding:13px 16px;border-top:1px solid var(--os-line);overflow-wrap:anywhere}
    #nuda-os-proposal .os-badge{display:inline-flex;align-items:center;border-radius:5px;padding:3px 6px;background:var(--os-soft);color:var(--os-accent);font-size:11px;white-space:normal}
    #nuda-os-proposal .os-badge.warn{background:var(--os-warn-bg);color:var(--os-warn)}
    #nuda-os-proposal .os-footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:18px;font-size:11px;color:var(--os-muted)}
    #nuda-os-proposal .os-filterrow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;align-items:center}
    #nuda-os-proposal .os-filterrow .os-button[aria-pressed="true"]{border-color:var(--os-accent);background:var(--os-soft);color:var(--os-accent)}
    #nuda-os-proposal .os-appgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    #nuda-os-proposal .os-app{padding:20px 17px;display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--os-paper);color:var(--os-ink);border:1px solid var(--os-line);border-radius:10px}
    #nuda-os-proposal .os-app svg{color:var(--os-accent);width:22px;height:22px}
    #nuda-os-proposal .os-detail{padding:18px;margin-top:16px;border-left:3px solid var(--os-accent);background:var(--os-paper);display:flex;flex-direction:column;gap:12px}
    #nuda-os-proposal .os-notices{position:absolute;right:15px;top:60px;width:min(380px,calc(100% - 30px));background:var(--os-paper);border:1px solid var(--os-line);border-radius:10px;box-shadow:0 12px 40px #001e2529;z-index:5}
    #nuda-os-proposal .os-notice{padding:16px;border-top:1px solid var(--os-line)}
    #nuda-os-proposal .os-searchresults{padding:14px var(--os-pad);border-bottom:1px solid var(--os-line);background:var(--os-paper)}
    #nuda-os-proposal .os-searchresults button{margin:5px 8px 0 0}
    #nuda-os-proposal .os-flow{display:flex;flex-wrap:wrap;gap:8px;padding:15px 0}
    #nuda-os-proposal .os-flow span{font-size:12px;color:var(--os-muted)}
    #nuda-os-proposal .os-flow .active{color:var(--os-accent);font-weight:600}
    #nuda-os-proposal .os-bodypad{padding:18px}
    #nuda-os-proposal .os-quietnav{--os-nav:var(--os-paper);--os-nav-ink:var(--os-ink)}
    #nuda-os-proposal .os-quietnav .os-sidebar{border-right:1px solid var(--os-line)}
    #nuda-os-proposal .os-quietnav .os-wordmark{color:var(--os-ink)}
    #nuda-os-proposal .os-quietnav .os-navlabel,#nuda-os-proposal .os-quietnav .os-user small{color:var(--os-muted)}
    #nuda-os-proposal .os-quietnav .os-nav button[aria-current="page"],#nuda-os-proposal .os-quietnav .os-nav button:hover{background:var(--os-soft);color:var(--os-accent)}
    #nuda-os-proposal .os-quietnav .os-count{color:var(--os-accent)}
    #nuda-os-proposal svg{width:16px;height:16px;flex-shrink:0}
    @media(max-width:850px){#nuda-os-proposal .os-shell{grid-template-columns:153px minmax(0,1fr)}#nuda-os-proposal{--os-pad:17px}#nuda-os-proposal .os-grid{grid-template-columns:1fr}#nuda-os-proposal .os-stack{display:grid;grid-template-columns:1fr 1fr}#nuda-os-proposal .os-appgrid{grid-template-columns:repeat(2,minmax(0,1fr))}#nuda-os-proposal .os-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:580px){#nuda-os-proposal .os-shell{display:block;min-height:0}#nuda-os-proposal .os-sidebar{padding:14px;gap:12px}#nuda-os-proposal .os-wordmark{font-size:24px;padding:0}#nuda-os-proposal .os-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}#nuda-os-proposal .os-nav button{padding:9px 4px;justify-content:center;font-size:11px;flex-direction:column;gap:5px}#nuda-os-proposal .os-navlabel,#nuda-os-proposal .os-count,#nuda-os-proposal .os-sidebarfoot{display:none}#nuda-os-proposal .os-topbar{padding:9px 13px}#nuda-os-proposal .os-pagehead{align-items:flex-start;flex-wrap:wrap;gap:12px}#nuda-os-proposal h1{font-size:21px}#nuda-os-proposal .os-metrics{gap:6px}#nuda-os-proposal .os-metric{padding:10px 8px}#nuda-os-proposal .os-metric strong{font-size:21px}#nuda-os-proposal .os-metric small{display:none}#nuda-os-proposal .os-metric .os-sub{font-size:11px}#nuda-os-proposal .os-stack{display:flex}#nuda-os-proposal .os-task{grid-template-columns:6px minmax(0,1fr);gap:10px}#nuda-os-proposal .os-task>.os-link{grid-column:2}#nuda-os-proposal th,#nuda-os-proposal td{padding:11px 8px}#nuda-os-proposal .os-optional{display:none}#nuda-os-proposal .os-appgrid{grid-template-columns:1fr 1fr}#nuda-os-proposal .os-app{padding:14px 12px}#nuda-os-proposal .os-notices{top:58px}#nuda-os-proposal input{font-size:16px}#nuda-os-proposal .os-tablewrap th:last-child,#nuda-os-proposal .os-tablewrap td:last-child{display:none}}
    #nuda-os-proposal .os-scopebar{padding:12px var(--os-pad);border-bottom:1px solid var(--os-line);display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--os-paper)}
    #nuda-os-proposal .os-segment{display:flex;gap:3px;padding:3px;border-radius:8px;background:var(--os-bg)}
    #nuda-os-proposal .os-segment button{padding:6px 11px;border:0;border-radius:6px;background:transparent;color:var(--os-muted);font-size:12px;min-height:32px}
    #nuda-os-proposal .os-segment button[aria-pressed="true"]{background:var(--os-soft);color:var(--os-accent);font-weight:600}
    #nuda-os-proposal .os-scopeperson{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12px;color:var(--os-muted)}
    #nuda-os-proposal .os-scopeperson select{max-width:190px;min-width:0;border:1px solid var(--os-line);border-radius:6px;padding:6px 8px;background:var(--os-paper);color:var(--os-ink)}
    #nuda-os-proposal .os-teamtabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
    #nuda-os-proposal .os-teamtabs button[aria-pressed="true"]{background:var(--os-soft);border-color:var(--os-accent);color:var(--os-accent)}
    #nuda-os-proposal .os-personlink{display:flex;align-items:center;gap:10px}
    #nuda-os-proposal .os-personlink .os-avatar{flex-basis:30px;height:30px;font-size:11px}
    #nuda-os-proposal .os-teamtable{table-layout:fixed}
    #nuda-os-proposal .os-teamtable th:first-child{width:30%}
    #nuda-os-proposal .os-teamtable td,#nuda-os-proposal .os-teamtable th{padding:13px 11px;vertical-align:middle}
    #nuda-os-proposal .os-teamtable .os-sub{font-size:11px}
    #nuda-os-proposal .os-num{font-variant-numeric:tabular-nums;white-space:nowrap}
    #nuda-os-proposal .os-mini-progress{height:4px;background:var(--os-line);margin-top:7px;border-radius:3px}
    #nuda-os-proposal .os-mini-progress span{display:block;height:100%;background:var(--os-accent);border-radius:3px}
    #nuda-os-proposal .os-team-summary{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;padding:17px;margin:18px 0;background:var(--os-soft);border-radius:9px;color:var(--os-ink)}
    #nuda-os-proposal .os-team-summary .os-sub{color:var(--os-ink)}
    #nuda-os-proposal .os-org{padding:20px 15px}
    #nuda-os-proposal .os-orgleader{max-width:285px;margin:0 auto;padding:16px;background:var(--os-soft);border:1px solid var(--os-line);border-radius:9px;text-align:center}
    #nuda-os-proposal .os-orgleader .os-avatar{width:38px;height:38px;margin:0 auto 7px}
    #nuda-os-proposal .os-orgbranches{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0;padding:24px 0 0;position:relative}
    #nuda-os-proposal .os-orgbranches:before{content:'';position:absolute;top:0;left:50%;height:24px;border-left:1px solid var(--os-line)}
    #nuda-os-proposal .os-orgbranches>li{min-width:0;position:relative;padding-top:15px;border-top:1px solid var(--os-line)}
    #nuda-os-proposal .os-orgbranches>li:before{content:'';position:absolute;top:0;left:50%;height:15px;border-left:1px solid var(--os-line)}
    #nuda-os-proposal .os-orgnode{padding:13px 11px;background:var(--os-paper);border:1px solid var(--os-line);border-radius:8px}
    #nuda-os-proposal .os-orgnode .os-link{display:block;padding:0 0 3px}
    #nuda-os-proposal .os-orgnode .os-sub{font-size:11px}
    #nuda-os-proposal .os-orgchildren{list-style:none;display:grid;gap:10px;border-left:1px solid var(--os-line);margin:13px 0 0 10px;padding:0 0 0 12px}
    #nuda-os-proposal .os-orgchildren li{position:relative}
    #nuda-os-proposal .os-orgchildren li:before{content:'';position:absolute;top:20px;left:-12px;width:12px;border-top:1px solid var(--os-line)}
    #nuda-os-proposal .os-careerline{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:13px 0}
    #nuda-os-proposal .os-careerline strong{font:500 17px Poppins,sans-serif}
    #nuda-os-proposal .os-requirement{padding:16px 0;border-top:1px solid var(--os-line)}
    #nuda-os-proposal .os-requirement .os-progress span{width:var(--career-progress)}
    #nuda-os-proposal .os-requirement .os-between{align-items:flex-start}
    #nuda-os-proposal .os-roster-footer{padding:12px 16px;border-top:1px solid var(--os-line);color:var(--os-muted);font-size:11px}
    #nuda-os-proposal .os-team-detail-head{display:flex;align-items:center;gap:13px;margin-bottom:16px}
    #nuda-os-proposal .os-team-detail-head .os-avatar{height:48px;flex-basis:48px;font-size:17px}

rcle-help')}${followup.unknown} ${confirmed?'Vlastnictví a sjednání mimo evidenci potvrdil klient.':'Vlastníka a sjednatele je potřeba ověřit s klientem.'}</p>${!dismissed?`<button type="button" class="os-link" data-bank-dismiss="${f.id}">Nejde o produkt tohoto klienta</button>`:''}</div>`:`<div id="ob-evidence-${f.id}" hidden></div>`}${state.bankConfirm===f.id?bankingConfirmation(c,f):''}</article>`;}

    const groupNames={housing:'Bydlení a energie',living:'Běžná spotřeba',insurance:'Platby pojišťovnám',investing:'Investice a penze',other:'Ostatní platby'},groups=Object.entries(groupNames).map(([id,name])=>({id,name,amount:-bankingTransactions.filter(t=>t.category===id&&t.amount<0).reduce((v,t)=>v+t.amount,0)/3}));

  function handleBankingClick(d){
    if(!['bankAction','bankEvidence','bankFilter','bankConfirm','bankDismiss','bankRestore'].some(k=>d[k]!==undefined))return false;
    const c=byClient(state.client);if(state.page!=='client'||!c)return true;
    if(d.bankAction==='connect'){state.bankConnect=true;state.bankManage=false;state.bankRevoke=false;}
    if(d.bankAction==='close-connect')state.bankConnect=false;
    if(d.bankAction==='manage'){state.bankManage=!state.bankManage;state.bankConnect=false;state.bankRevoke=false;}
    if(d.bankAction==='request-disconnect')state.bankRevoke=true;
    if(d.bankAction==='cancel-confirm'){const b=bankingMutable(c);if(b.reviewDrafts)delete b.reviewDrafts[state.bankConfirm];state.bankConfirm=null;}
    if(d.bankAction==='cancel-disconnect')state.bankRevoke=false;
    if(d.bankAction==='disconnect'){bankingMutable(c).connection='disconnected';state.bankRevoke=false;toast('Propojení je v návrhu odpojené. Poslední načtené údaje zůstávají označené datem.');}
    if(d.bankEvidence)state.bankEvidence=state.bankEvidence===d.bankEvidence?null:d.bankEvidence;
    if(d.bankFilter){state.bankFilter=d.bankFilter;state.bankConfirm=null;}
    if(d.bankConfirm)state.bankConfirm=d.bankConfirm;
    if(d.bankDismiss||d.bankRestore){const id=d.bankDismiss||d.bankRestore;if(bankingFindings.some(f=>f.id===id)){bankingMutable(c).reviews[id]={status:d.bankDismiss?'dismissed':'inferred'};state.bankConfirm=null;toast(d.bankDismiss?'Nález je vyřazený. Najdete ho ve filtru Vyřazené.':'Nález je znovu připravený k ověření.');}}
    if(d.bankAction==='brief'&&bankingHasData(c)){const t=bankingTotals();learningDownload('nuda-uno-financni-profil-'+c.id+'.txt',`nuda uno · Podklady na schůzku\n${c.name} · ${c.id}\nUkázková bankovní data · 1. 6. – 31. 8. 2026\n\nPrůměrné příchozí platby: ${bankingMoney(t.income)}\nPrůměrné odchozí platby: ${bankingMoney(t.outgoing)}\nRozdíl: ${bankingMoney(t.net)}\nVlastní převody jsou vyloučené; profil neobsahuje nepřipojené účty.\n\n${bankingFindings.filter(f=>bankingReview(c,f.id).status!=='dismissed').map(f=>{const r=bankingReview(c,f.id),followup=bankingFollowup(c,f);return `${r.status==='confirmed'?r.product:f.title} · ${f.provider}\n${r.status==='confirmed'?'Potvrzeno klientem: '+r.note:'Odhad z transakcí: '+f.signal}\nPozorovaná platba: ${bankingMoney(-bankingEvidence(f)[0].amount)} měsíčně\n${followup.question}\n${followup.unknown}`;}).join('\n\n')}`);toast('Podklady na schůzku jsou připravené ke stažení.');}
    persist();render();
    const focusTarget=d.bankAction==='connect'?'#ob-connect-title':d.bankConfirm?'#ob-confirm-title':d.bankEvidence?'[data-bank-evidence="'+d.bankEvidence+'"]':d.bankFilter?'[data-bank-filter="'+d.bankFilter+'"]':(d.bankDismiss||d.bankRestore||d.bankAction==='cancel-confirm')?'#ob-products-title':null;
    if(focusTarget)root.querySelector(focusTarget)?.focus({preventScroll:!['#ob-connect-title','#ob-confirm-title'].includes(focusTarget)});
    return true;
  }
  function handleBankingSubmit(form,values){

    return true;
  }

  function timeline(c){

  function connectorList(){return `<section class="os-connect-hero"><div><p class="os-eyebrow"><span class="os-brand-case">nuda uno</span> × VAŠE AI</p><h2>Dejte asistentovi kontext.<br>A sobě náskok.</h2><p>Příprava na schůzku, servis kmene nebo přehled provizí. Připravte přístup k tomu, co váš asistent potřebuje.</p><div class="os-head-actions">${action(icon('plus')+' '+(state.connectorDraft?'Pokračovat v konfiguraci':'Vytvořit konektor'),'connector-new','',true)}${settingsAction('Jak připojení funguje','docs')}</div></div><div class="os-connection-map" aria-label="nuda uno se propojuje s vaším AI asistentem přes MCP"><span class="os-app-monogram">n</span><span class="os-connection-line"></span><span class="os-connection-protocol">MCP</span><span class="os-connection-line"></span><span class="os-connection-agent">${icon('bot')}</span><small>Váš profil → vybrané agendy → váš asistent</small></div></section><div class="os-setting-notice">${icon('info')}<p><strong>Konfiguraci si připravíte už teď.</strong> Vzdálený MCP server zatím není aktivní. Po jeho aktivaci zde získáte adresu a připojení potvrdíte přihlášením ke svému účtu.</p></div><section class="os-panel"><div class="os-panelhead"><div><h2>Moje konektory</h2><p class="os-sub">Jan Procházka · ${state.connectors.length} připravených konfigurací</p></div>${badge('Pouze čtení')}</div>${state.connectors.length?state.connectors.map(c=>`<div class="os-connector-row"><span class="os-section-icon">${icon('plug')}</span><div class="os-connector-title"><h3>${esc(c.name)}</h3><p class="os-sub">${connectorOwners(c).length===1?'Můj kmen':'Můj kmen + '+(connectorOwners(c).length-1)+' z týmu'} · ${connectorScopes(c).length} oprávnění</p><p class="os-caption">Upraveno ${learningStamp(c.updatedAt)}</p></div>${badge('Konfigurace připravena')}${action('Otevřít','connector-open',c.id)}</div>`).join(''):`<div class="os-setting-empty"><span class="os-section-icon">${icon('unplug')}</span><h3>První propojení začíná u vás</h3><p clas mbers.includes(p.id)}"><span class="os-avatar">${p.initials}</span><span><strong>${p.name}</strong><small>${p.rank}</small></span><span class="os-permission-check">${icon(d.members.includes(p.id)?'check':'plus')}</span></button>`).join('')}</div>`:''}</fieldset><p id="os-connector-error" class="os-negative os-setting-space" role="alert">${esc(d.error||'')}</p><div class="os-head-actions os-setting-space"><button type="submit" class="os-button os-primary">${d.id?'Uložit změny':'Vytvořit konfiguraci'}</button>${action('Zahodit změny','connector-discard')}</div><p class="os-caption os-setting-space">Konfigurace se uloží pro tuto relaci prohlížeče. Pro další použití si stáhněte její kopii.</p></section><aside class="os-stack"><section class="os-panel os-bodypad"><p class="os-eyebrow">NÁHLED OPRÁVNĚNÍ</p><h2 id="os-connector-preview-name">${esc(d.name.trim()||'Váš nový konektor')}</h2><div class="os-separator"></div>${connectorPreview(d)}<div class="os-separator"></div><p class="os-caption">Náhled vychází z evidence nuda uno. Žádný AI nástroj zatím data nečte.</p></section><section class="os-panel os-bodypad"><span class="os-section-icon">${icon('shield-check')}</span><h2 class="os-setting-space">Rozsah máte v rukou</h2><p class="os-sub os-setting-copy">Po aktivaci server ověří oprávnění vašeho účtu. Konektor nebude moci měnit klienty, sjednávat smlouvy ani zadávat výplaty.</p>${settingsAction('Dokumentace MCP →','docs')}</section></aside></div></form>`;

  function connectorPreview(c){const owners=connectorOwners(c);return `<div class="os-connector-summary">${meta([['Vlastník','Jan Procházka · 142'],['Rozsah',owners.length===1?'Jen můj kmen':'Můj kmen + '+(owners.length-1)+' z týmu'],['Operace','Čtení údajů']])}<div class="os-scope-pills">${connectorScopes(c).map(s=>`<code>${s}</code>`).join('')}</div>${connectorAgendas.filter(([id])=>c.agendas.includes(id)).map(([id,label])=>{const rows=({clients,cases,contracts})[id];return `<div class="os-preview-count"><span>${label}</span><strong>${rows?fmt(rows.filter(r=>owners.includes(r.owner)).length):'Výpisy vybraných poradců'}</strong></div>`;}).join('')}</div>`;}
  function connectorDetail(){const c=activeConnector();if(!c){state.settingsTab='connectors';return settingsPage();}return crumb('settings','AI a konektory',c.name)+head(c.name,'MCP konektor · '+esc(c.id),badge('Konfigurace připravena'))+`<div class="os-settings-grid"><div class="os-stack"><section class="os-panel os-bodypad"><div class="os-between"><h2>Přehled připojení</h2>${action('Upravit','connector-edit',c.id)}</div><div class="os-separator"></div>${meta([['Vlastník','Jan Procházka · poradce 142'],['Vytvořeno',learningStamp(c.createdAt)],['Poslední změna',learningStamp(c.updatedAt)],['Použití','Dosud nepřipojeno']])}<div class="os-endpoint"><p class="os-eyebrow">ADRESA MCP SERVERU</p><p>Adresa bude dostupná po aktivaci serveru</p><span class="os-caption">Následně připojení potvrdíte přes OAuth.</span></div><div class="os-head-actions os-setting-space">${action(icon('download')+' Stáhnout konfiguraci','connector-export',c.id)}${settingsAction('Návod k připojení →','docs')}</div><p class="os-caption os-setting-space">JSON specifikace obsahuje vybraná oprávnění a identifikátory poradců. Neobsahuje klientská data ani přístupový klíč.</p></section><section class="os-panel os-bodypad"><h2>Změny konfigurace</h2><ol class="os-timeline os-setting-space">${c.history.map(h=>`<li><h3>${esc(h.label)}</h3><p class="os-caption">Jan Procházka · ${learningStamp(h.at)}</p></li>`).join('')}</ol></section></div><div class="os-stack"><section class="os-panel os-bodypad"><h2>Připravená oprávnění</h2><div class="os-separator"></div>${connectorPreview(c)}${connectorOwners(c).length>1?`<p class="os-caption os-setting-space">Vybraní lidé: ${connectorOwners(c).slice(1).map(ownerName).join(', ')}.</p>`:''}</section><section class="os-panel os-bodypad"><h2>Správa konfigurace</h2><p class="os-sub os-setting-copy">Konfigurace je uložená v této relaci. Její odstranění se netýká klientů ani smluv.</p>${state.connectorDelete===c.id?`<p class="os-sub os-setting-copy">Odstranit konfiguraci „${esc(c.name)}“?</p><div class="os-head-actions">${action('Odstranit konfiguraci','connector-confirm-delete',c.id)}${action('Ponechat','connector-cancel-delete')}</div>`:action('Odstranit…','connector-delete',c.id)}</section></div></div>`;}
  function connectorSpecification(c){return {format:'nuda-uno-connector-specification',version:1,id:c.id,name:c.name,status:'configuration_only',owner:'jan',advisorNumber:'0142',requestedScopes:connectorScopes(c),requestedOwners:connectorOwners(c),access:'read_only',transport:'streamable-http',endpoint:null,authorization:{type:'oauth2.1',pkce:'S256',status:'awaiting_server_activation'},updatedAt:c.updatedAt};}
  function connectorGuide(){return `# nuda uno · Připojení přes MCP\n\nStav: konfigurace přístupu je dostupná. Vzdálený MCP server, autorizační služba a přístupové URL zatím nejsou aktivní.\n\n## Postup\n1. Nastavení → AI a konektory → Vytvořit konektor. Zadejte název, vyberte agendy a případně konkrétní členy týmu.\n2. Uložte konfiguraci. V detailu stáhněte JSON specifikaci pro správce integrace. Jde o popis požadovaného přístupu, nikoli univerzální importní soubor pro AI klienty. endpoint: null znamená, že adresa serveru ještě není dostupná.\n3. Po aktivaci serveru zkopírujte jeho skutečnou HTTPS adresu z detailu konektoru. Do AI nástroje podporujícího vzdálené MCP přidejte server s transportem Streamable HTTP.\n4. Přihlaste se ke svému účtu přes OAuth a ověřte název konektoru i požadované agendy a poradce. Heslo ani přístupový token nevkládejte do chatu.\n5. První požadavek směřujte na vlastní profil. Zkontrolujte, že odpovídá přihlášenému poradci, a ověřte omezení na vybrané agendy.\n\n## Návrh integračního rozhraní\nTransport: Streamable HTTP přes HTTPS. Autorizace: OAuth 2.1 s PKCE, objevování přes OAuth Protected Resource Metadata. Server ověří identitu a skutečná oprávnění účtu u každého požadavku. Lokální JSON neuděluje přístup.\n\nNavržené scopes: profile:read, clients:read, cases:read, contracts:read, commissions:read. Zpřístupněni jsou Jan a pouze výslovně vybraní poradci, bez automatického zahrnutí celé větve. Profil se vztahuje na vlastníka konektoru. Dokumenty, zápis a sjednání smluv nejsou součástí. Finální katalog nástrojů poskytne server po aktivaci.\n\n## Uložení konfigurace\nKonfigurace a rozepsané změny zůstávají v této relaci prohlížeče. Export neobsahuje klientské záznamy ani token. Nové okno může mít vlastní relaci; synchronizace mezi zařízeními není zapnutá.\n\n## Zdroje\nMCP autorizace: https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization\nVzdálené MCP servery: https://modelcontextprotocol.io/registry/remote-servers\n`;}
  function settingsDocs(){return `<div class="os-settings-grid"><section class="os-panel os-bodypad"><p class="os-eyebrow">PRŮVODCE PŘIPOJENÍM</p><h2>Od prvního konektoru k vašemu asistentovi</h2><p class="os-sub os-setting-copy">Pro AI nástroje s podporou vzdáleného MCP, transportu Streamable HTTP a OAuth.</p><ol class="os-setup-steps"><li><div><h3>Připravte si konektor</h3><p>Pojmenujte připojení, vyberte agendy a případně konkrétní lidi z týmu. Konfiguraci uložte.</p>${action('Vytvořit konektor →','connector-new')}</div></li><li><div><h3>Získejte adresu serveru</h3><p>Po aktivaci MCP serveru najdete jeho HTTPS adresu v detailu konektoru. Zatím je dostupná konfigurace a její export.</p>${badge('Čeká na aktivaci serveru',true)}</div></li><li><div><h3>Přidejte připojení v AI nástroji</h3><p>Zvolte vzdálený MCP server, vložte jeho adresu a použijte transport Streamable HTTP. Pojmenování této volby se liší podle nástroje.</p></div></li><li><div><h3>Potvrďte svůj účet a oprávnění</h3><p>Přihlaste se přes OAuth. Před potvrzením zkontrolujte agendy i vybrané poradce. Heslo ani token nepatří do chatu.</p></div></li><li><div><h3>Ověřte připojení</h3><p>Nechte asistenta načíst váš profil. Musí odpovídat přihlášenému poradci a přistupovat jen k povoleným agendám.</p></div></li></ol><div class="os-separator"></div><h2>Navržená oprávnění</h2><p class="os-caption os-setting-copy">Následující názvy popisují připravený návrh rozhraní. Finální katalog nástrojů zveřejní server při aktivaci.</p><div class="os-doc-scopes">${[['profile','Můj profil'],...connectorAgendas.map(([id,label])=>[id,label])].map(([id,l])=>`<div><code>${id}:read</code><span>${l}</span></div>`).join('')}</div><p class="os-sub os-setting-copy">Přílohy dokumentů, změny údajů a sjednávání nejsou součástí přístupu. Týmové agendy se omezí na konkrétní vybrané poradce.</p></section><div class="os-stack"><section class="os-panel os-bodypad"><span class="os-section-icon">${icon('file-down')}</span><h2 class="os-setting-space">Dokumentace po ruce</h2><p class="os-sub os-setting-copy">Postup, technické parametry i pravidla přístupu v jednom souboru.</p>${action('Stáhnout návod · Markdown','connector-guide')}<p class="os-caption os-setting-space">JSON specifikaci stáhnete z detailu uloženého konektoru. Nejde o univerzální importní formát AI nástrojů.</p></section><section class="os-panel os-bodypad"><h2>Pro správce integrace</h2><div class="os-separator"></div>${meta([['Transport','Streamable HTTP · HTTPS'],['Autorizace','OAuth 2.1 · PKCE'],['Zjištění přihlášení','OAuth Protected Resource Metadata'],['Stav služby','Čeká na aktivaci']])}<p class="os-caption os-setting-space">Oprávnění musí ověřovat server u každého požadavku. Stažená specifikace sama o sobě přístup neuděluje.</p><div class="os-setting-links"><a class="os-link" href="https://modelcontextprotocol.io/specification/2025-11-25/basic/authorization" target="_blank" rel="noopener noreferrer">MCP: autorizace ${icon('arrow-up-right')}</a><a class="os-link" href="https://modelcontextprotocol.io/registry/remote-servers" target="_blank" rel="noopener noreferrer">MCP: vzdálené servery ${icon('arrow-up-right')}</a></div></section></div></div>`;}
  function settingsApp(){return `<section class="os-app-hero"><div class="os-app-identity"><img src="./icons/app-192.png" width="88" height="88" alt="Ikona nuda uno"><div><p class="os-eyebrow">VAŠE MOBILNÍ APLIKACE</p><h2>nuda uno.<br>Váš svět v kapse.</h2></div></div><p>Klienti, smlouvy i tým po ruce, i když jste zrovna na cestě. Připravujeme nuda uno pro váš telefon.</p><div class="os-head-actions">${badge('Mobilní aplikace')}${badge('iOS a Android')}</div></section><section class="os-panel os-bodypad os-setting-space"><h2>nuda uno do vašeho telefonu</h2><p class="os-sub os-setting-copy">Vyberte si podle svého zařízení. Odkazy na stažení doplníme po vydání aplikace.</p><div class="os-mobile-store-grid"><article class="os-mobile-store"><div class="os-between"><span class="os-section-icon">${icon('smartphone')}</span>${badge('Připravujeme')}</div><h3>Pro iPhone</h3><p class="os-sub">Mobilní aplikace pro iOS</p><button type="button" class="os-button os-store-button" disabled aria-describedby="os-ios-availability">${icon('download')} App Store</button><p id="os-ios-availability" class="os-caption">Stažení zatím není dostupné.</p></article><article class="os-mobile-store"><div class="os-between"><span class="os-section-icon">${icon('smartphone')}</span>${badge('Připravujeme')}</div><h3>Pro Android</h3><p class="os-sub">Mobilní aplikace pro Android</p><button type="button" class="os-button os-store-button" disabled aria-describedby="os-android-availability">${icon('download')} Google Play</button><p id="os-android-availability" class="os-caption">Stažení zatím není dostupné.</p></article></div></section>`;}
  function handleSettingsInput(e){if(e.target.id!=='os-connector-name'||!state.connectorDraft)return false;state.connectorDraft.name=e.target.value.slice(0,80);state.connectorDraft.error='';const preview=root.querySelector('#os-connector-preview-name');if(preview)preview.textContent=state.connectorDraft.name.trim()||'Váš nový konektor';return true;}
  function handleSettingsClick(d){
    if(d.settingsTab!==undefined){state.settingsTab=d.settingsTab;state.connectorDelete=null;navigate('settings');return true;}
    if(d.connectorNew!==undefined){state.settingsTab='connectors';if(!state.connectorDraft)state.connectorDraft={id:null,name:'',agendas:['clients','cases','contracts'],teamEnabled:false,members:[],error:''};navigate('connectorEditor');return true;}
    if(d.connectorOpen){state.connectorId=d.connectorOpen;state.connectorDelete=null;state.settingsTab='connectors';navigate('connector');return true;}
    if(d.connectorEdit){const c=state.connectors.find(c=>c.id===d.connectorEdit);if(c){if(state.connectorDraft&&state.connectorDraft.id!==c.id){toast('Nejdřív dokončete nebo zahoďte rozpracovanou konfiguraci.');return true;}if(!state.connectorDraft)state.connectorDraft=JSON.parse(JSON.stringify(c));navigate('connectorEditor');}return true;}
    const draft=state.connectorDraft;
    if(d.connectorAgenda!==undefined&&draft){if(connectorAgendas.some(([id])=>id===d.connectorAgenda))draft.agendas=draft.agendas.includes(d.connectorAgenda)?draft.agendas.filter(id=>id!==d.connectorAgenda):[...draft.agendas,d.connectorAgenda];return true;}
    if(d.connectorAudience!==undefined&&draft){draft.teamEnabled=d.connectorAudience==='team';draft.error='';return true;}
    if(d.connectorMember!==undefined&&draft){if(team.some(p=>p.id===d.connectorMember))draft.members=draft.members.includes(d.connectorMember)?draft.members.filter(id=>id!==d.connectorMember):[...draft.members,d.connectorMember];draft.error='';return true;}
    if(d.connectorDiscard!==undefined){state.connectorDraft=null;state.settingsTab='connectors';navigate('settings');return true;}
    if(d.connectorDelete){state.connectorDelete=d.connectorDelete;return true;}

  initCaseWorkflows();initLearningWorkflows();initCommissionWorkflows();initNotificationCenter();initSettings();initBanking();migrateCommissionContexts();
  if(state.designVersion!=='studio-1'){state.darkSidebar=false;state.designVersion='studio-1';persist();}
  function render(){

    root.querySelector('.os-nav [data-go="cases"] .os-count').textContent=cases.filter(inScope).length;
    const renderers={connector:connectorDetail,connectorEditor:connectorEditor,inbox:inboxPage,opportunity:opportunityPage,message:messagePage,compose:()=>composeMessagePage(),home:()=>state.scope==='team'?teamPage(true):home(),clients:clientsPage,client:clientPage,newclient:newClientPage,cases:casesPage,case:casePage,contracts:contractsPage,contract:contractPage,commissions:commissionsPage,statement:statementPage,commissionItem:commissionItemPage,commissionSource:commissionSourcePage,team:teamPage,member:memberPage,apps:appsPage,wizard:wizardPage,academy:academyPage,study:studyPage,knowledge:knowledgePage,article:articlePage,help:supportWorkflowPage,settings:settingsPage,document:documentPage,commissionRule:commissionRulePage,commissionDispute:commissionDisputePage,supportTicket:supportTicketPage,supportAttachment:supportAttachmentPage,caseSolution:caseSolutionPage,caseFile:caseFilePage,credential:credentialPage,learningRecord:learningRecordPage,tasks:tasksPage,task:taskPage,careerRules:careerRulesPage};
    content.innerHTML=(state.page==='team'&&navigationStack.at(-1)?.page==='message'?'<div class="os-breadcrumb"><button class="os-link" data-back="message">Zpět ke zprávě</button></div>':'')+(renderers[state.page]||home)()+`<footer class="os-footer"><span>nuda uno</span><button class="os-link" data-go="help">${icon('circle-help')} Potřebujete pomoc?</button></footer>`;
    teamScope();renderNotices();
    const feedback=root.querySelector('#os-feedback');feedback.hidden=!state.toast;feedback.innerHTML=state.toast?`${icon('check')}<span>${esc(state.toast)}</span><button data-clear-toast="" aria-label="Zavřít hlášku">${icon('x')}</button>`:'';
    icons();
    if(mobileUI.focusContent){mobileUI.focusContent=false;content.focus({preventScroll:true});globalThis.scrollTo?.({top:0,behavior:'instant'});}
    else if(scopeFocus)root.querySelector(scopeFocus)?.focus({preventScroll:true});
  }
  root.addEventListener('click',e=>{
    if(handleMobileClick(e))return;
    const b=e.target.closest('button');if(!b){if(!e.target.closest('#os-notices'))dismiss();return;}if(!root.contains(b))return;const d=b.dataset,origin=navigationSnapshot();
    // Presentation-only attachments intentionally keep the current view and do not request a file.
    if(d.contractAttachment!==undefined)return;
    if(handleBankingClick(d))return;
    if(d.notification&&!state.read.includes(d.notification))state.read.push(d.notification);
    if(d.back!==undefined){goBack(d.back);return;}
    if(handleNoticeClick(d)){recordNavigation(origin,d);persist();const panelOnly=['noticeTab','noticeUnread','noticeRead','markRead','noticeSnooze','noticeRestore'].some(k=>d[k]!==undefined);if(panelOnly&&state.page!=='inbox'){renderNotices();icons();}else render();return;}
    if(handleSettingsClick(d)){recordNavigation(origin,d);persist();dismiss();render();return;}
    if(d.searchAll!==undefined){state.searchAll=true;globalSearchResults();return;}
    if(handleCaseClick(d)||handleLearningClick(d)||handleCommissionClick(d)){recordNavigation(origin,d);persist();dismiss();render();return;}
    if(d.listAll!==undefined){state.scope='team';state.member='all';state.includeBranch=false;state.listPage=1;render();return;}
    if(d.branchScope){state.includeBranch=d.branchScope==='branch';resetList();render();return;}
    if(d.careerRules!==undefined)navigate('careerRules');
    if(d.notification&&!state.read.includes(d.notification))state.read.push(d.notification);
    if(d.notices!==undefined){const el=root.querySelector('#os-notices');el.hidden=d.notices==='false'||!el.hidden;root.querySelector('[data-notices="true"]').setAttribute('aria-expanded',String(!el.hidden));if(!el.hidden){renderNotices();icons();}return;}
    if(d.clearToast!==undefined){state.toast='';render();return;}
    if(d.go!==undefined){if(d.go==='apps')state.client=null;visitMenu(d.go);}
    if(d.scope!==undefined){state.scope=d.scope;state.member='all';state.includeBranch=false;state.searchAll=false;navigationStack.length=0;state.client=null;state.toast='';resetList();if(['opportunity','team','member','client','case','contract','document','newclient','wizard','study','caseSolution','caseFile','credential','learningRecord','task','tasks','careerRules'].includes(state.page))state.page='home';if(['statement','commissionItem','commissionSource','commissionRule','commissionDispute'].includes(state.page))state.page='commissions';dismiss();}
    if(d.teamView){state.scope='team';state.member='all';state.teamView=d.teamView;navigate('team');state.teamView=d.teamView;}
    if(d.teamBranch){state.branchOpen=!state.branchOpen;}
    if(d.teamMember)openMember(d.teamMember);
    if(d.memberTab){state.memberTab=d.memberTab;resetList();}
    if(d.teamData){state.scope='team';state.member=d.memberid||'all';if(d.teamOwn)state.includeBranch=false;navigate(d.teamData);}
    if(d.clientId)openClient(d.clientId);
    if(d.caseId)openCase(d.caseId);
    if(d.contractId){const r=contracts.find(r=>r.id===d.contractId);if(r){state.contractId=r.id;state.client=r.client;state.scope=r.owner==='jan'?'personal':'team';state.member=r.owner==='jan'?'all':r.owner;navigate('contract');}}
    if(d.tab){state.tab=d.tab;resetList();}
    if(d.newClient!==undefined)navigate('newclient');
    if(d.clientNewCase){state.client=d.clientNewCase;state.appCategory='all';navigate('apps');}
    if(d.app!==undefined){state.wizardApp=Number(d.app);state.wizardClient=state.client||null;state.wizardExisting=null;navigate('wizard');}
    if(d.editCase){const r=cases.find(r=>r.id===d.editCase);state.wizardApp=r.app;state.wizardClient=r.client;state.wizardExisting=r.id;navigate('wizard');}
    if(d.category){state.appCategory=d.category;}
    if(d.paginate){state.listPage+=Number(d.paginate);}
    if(d.document){state.doc=d.document;state.docReturn=state.page;navigate('document');}
    if(d.docBack!==undefined){goBack();return;}
    if(d.teamCommissions!==undefined){state.scope='team';state.member='all';navigate('commissions');}
    if(d.ownCommissions!==undefined)openStatement(statementKey('jan','2026-08'));
    if(d.statement)openStatement(d.statement);
    if(d.statementTab){state.statementTab=d.statementTab;resetList();}
    if(d.commissionItem){const item=eventById(d.commissionItem);if(item){openStatement(statementKey(d.recipient||splitKey(state.statementKey).recipient,item.period));state.commissionItem=item.id;navigate('commissionItem');}}
    if(d.commissionSource){state.commissionItem=d.commissionSource;navigate('commissionSource');}
    if(d.auditStatement!==undefined){const report=statementAudit(...Object.values(splitKey(state.statementKey)));const failed=report.checks.filter(c=>!c.ok).length+(report.paymentOK?0:1);toast(failed?'Kontrola nalezla '+failed+' nesrovnalostí.':report.pending.length?'Zařazené položky souhlasí. '+report.pending.length+' zdrojová položka čeká na přiřazení.':'Všechny kontroly zařazených položek souhlasí.');}
    if(d.export!==undefined)exportStatement();
    if(d.study!==undefined){state.lesson=state.courseDone?0:1;navigate('study');}
    if(d.lesson!==undefined){state.lesson=Number(d.lesson);}
    if(d.courseComplete!==undefined){state.courseDone=true;navigate('academy');toast('Studijní blok je dokončený. Váš plán je aktualizovaný.');persist();}
    if(d.article!==undefined){state.article=Number(d.article);navigate('article');}
    recordNavigation(origin,d);dismiss();render();if(d.notification)persist();
  });
  root.addEventListener('change',e=>{if(handleBankingInput(e)){persist();return;}if(handleNoticeInput(e)){persist();return;}if(handleCaseChange(e)||handleLearningChange(e)||handleCommissionChange(e)){persist();render();return;}const t=e.target;if(t.id==='os-team-person'){state.member=t.value;state.includeBranch=false;if(state.page==='member'&&t.value==='all')state.page='team';resetList();}else if(t.id==='os-list-filter'){state.filter=t.value;state.listPage=1;}else if(t.id==='os-month'){state.month=t.value;}else if(t.id==='os-density'){state.density=t.value;persist();}else if(t.id==='os-nav-theme'){state.darkSidebar=t.value==='dark';persist();}else if(t.dataset.caseCheck!==undefined){const r=cases.find(c=>c.id===state.caseId);r.docs[Number(t.dataset.caseCheck)][1]=t.checked;const done=r.docs.every(d=>d[1]);r.status=done?'Připraveno ke srovnání':'Chybí podklady';r.next=done?'Připravit srovnání variant':'Doplnit '+r.docs.find(d=>!d[1])[0].toLocaleLowerCase('cs');persist();}else return;render();});
  root.addEventListener('input',e=>{if(handleBankingInput(e)){persist();return;}if(handleSettingsInput(e)){persist();return;}if(handleNoticeInput(e)){persist();return;}if(handleCaseInput(e)||handleLearningInput(e)||handleCommissionInput(e)){persist();return;}if(e.target.id==='os-list-search'){const position=e.target.selectionStart;state.query=e.target.value;state.listPage=1;render();const input=root.querySelector('#os-list-search');input.focus({preventScroll:true});input.setSelectionRange(position,position);}});
  const nowLabel=()=>new Intl.DateTimeFormat('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date());
  root.addEventListener('submit',e=>{
    const form=e.target;if(!form.id||!form.id.startsWith('os-'))return;e.preventDefault();if(!form.reportValidity())return;const values=Object.fromEntries(new FormData(form)),origin=navigationSnapshot();
    if(handleBankingSubmit(form,values)||handleSettingsSubmit(form,values)||handleNoticeSubmit(form,values)||handleCaseSubmit(form,values)||handleLearningSubmit(form,values)||handleCommissionSubmit(form,values)){recordNavigation(origin,{});persist();render();return;}
    if(form.id==='os-note-form'||form.id==='os-case-note-form'){const note=values.note.trim();if(!note)return;const record=form.id==='os-note-form'?byClient(state.client):cases.find(r=>r.id===state.caseId);record.notes.unshift({text:note,at:nowLabel()});record.updated=new Date().toLocaleDateString('sv-SE');toast('Poznámka uložena.');}
    if(form.id==='os-new-client-form'){const name=values.name.trim();if(name.length<3){root.querySelector('#os-form-error').textContent='Zadejte jméno a příjmení nebo název firmy — alespoň 3 znaky.';return;}if(clients.some(c=>norm(c.name)===norm(name)&&c.owner===values.owner)){root.querySelector('#os-form-error').textContent='Klienta s tímto jménem už má vybraný poradce v péči.';return;}const c=addClient(name,values.owner,clients.filter(c=>c.owner===values.owner).length,values.type==='company');c.city=values.city.trim();c.email=values.email.trim()||'Neuvedeno';c.phone='Neuvedeno';c.updated=new Date().toLocaleDateString('sv-SE');team.forEach(p=>p.clients=clients.filter(c=>c.owner===p.id).length);openClient(c.id);toast('Klient je založený. Můžete začít řešit jeho potřeby.');}
    if(form.id==='os-wizard-form'){const c=byClient(values.client);let r=cases.find(r=>r.id===state.wizardExisting);if(!r)r=createCase(c,state.wizardApp,0);r.client=c.id;r.owner=c.owner;r.purpose=values.purpose.trim();r.inputAmount=Number(values.amount);r.memo=values.memo.trim();r.amount=values.purpose.trim()+' · '+(state.wizardApp===3||state.wizardApp===5?fmt(Number(values.amount)):money(Number(values.amount)));r.title=apps[r.app][1]+' · '+values.purpose.trim();r.status='Chybí podklady';r.next='Připravit podklady pro řešení';r.docs[r.docs.length-1][1]=false;openCase(r.id);toast('Případ byl uložen. Můžete pokračovat přípravou podkladů.');}
    if(form.id==='os-support-form'){state.supportDraft=values.draft.trim();toast('Koncept odpovědi uložen.');}
    recordNavigation(origin,{});persist();render();
  });
  const search=root.querySelector('#os-global-search');
  search.addEventListener('input',()=>{state.searchAll=false;globalSearchResults();});
  root.addEventListener('keydown',e=>{if(handleMobileKey(e))return;if(e.key==='Escape'){const wasOpen=!root.querySelector('#os-notices').hidden;dismiss();if(wasOpen)root.querySelector('[data-notices="true"]').focus();else search.blur();}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();setMobileMenu(false,false);setMobileSearch(true,true);}});
  const modelContext=document.modelContext;
  if(modelContext?.registerTool){
    const lifecycle=new AbortController();
    const register=tool=>{try{Promise.resolve(modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}};
    register({name:'nuda_read_workspace_state',title:'Aktuální pracovní pohled',description:'Vrátí aktuální stránku a rozsah pracovního pohledu. Nemění záznamy.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>({page:state.page,scope:state.scope,member:state.member,includeBranch:state.includeBranch})});
    register({name:'nuda_open_workspace',title:'Otevřít pracovní agendu',description:'Otevře existující stránku nuda uno. Pouze naviguje; nezakládá ani nemění pracovní záznamy.',inputSchema:{type:'object',properties:{page:{type:'string',enum:['home','clients','cases','contracts','commissions','team','apps','academy','knowledge','help']}},required:['page'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:input=>{if(!input||typeof input!=='object'||Object.keys(input).some(k=>k!=='page')||!['home','clients','cases','contracts','commissions','team','apps','academy','knowledge','help'].includes(input.page))throw new Error('Neplatná stránka.');visitMenu(input.page);render();return{page:state.page,scope:state.scope,member:state.member};}});
    window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
  }
  const bankingDeepLink=globalThis.location?.hash?.match(/^#client\/(CL-\d+)\/banking$/);
  if(bankingDeepLink&&byClient(bankingDeepLink[1])){openClient(bankingDeepLink[1]);state.tab='banking';}
  mobileViewport.addEventListener?.('change',syncMobileViewport);
  syncMobileViewport();
  render();
})();
